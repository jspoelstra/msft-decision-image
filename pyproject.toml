[project]
name = "chart-lens"
version = "0.1.0"
description = "Image-only chart-claim verification with Microsoft Decision 1.1"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.20,<2",
    "exchange-calendars>=4.8,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "matplotlib>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
    "yfinance==1.8.0",
]

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "pytest", "pytest-mock", "ruff", "tqdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
